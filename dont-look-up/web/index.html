<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Don't Look Up</title>
<style>
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 800; src: url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2'); }
  html, body { margin: 0; padding: 0; background: #000; width: 1080px; height: 1920px; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #cap { position: absolute; left: 70px; right: 70px; top: 1010px; text-align: center; font-family: 'Barlow Condensed'; font-weight: 800;
         font-size: 74px; line-height: 1.08; color: #fff; letter-spacing: 0.5px; }
  #cap span { display: inline-block; margin: 0 9px; -webkit-text-stroke: 12px #000; paint-order: stroke fill; text-shadow: 0 6px 0 rgba(0,0,0,0.55); transform-origin: 50% 70%; }
  #cap span.hl { color: #ffd21a; }
  #black { position: absolute; inset: 0; background: #000; opacity: 0; }
  #white { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #glow { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 60% 35% at 50% 100%, rgba(150,190,255,0.55), rgba(0,0,0,0) 70%); }

  /* notification banner */
  #banner { position: absolute; left: 50px; right: 50px; top: 70px; height: 170px; background: rgba(250,249,246,0.98); border-radius: 34px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 0 0 4px rgba(0,0,0,0.85); font-family: 'Barlow Condensed'; transform: translateY(-320px); }
  #banner .ico { position: absolute; left: 30px; top: 26px; width: 44px; height: 44px; border-radius: 12px; background: #1d2433; }
  #banner .ico::after { content: ''; position: absolute; left: 11px; top: 12px; width: 22px; height: 16px; border-radius: 8px; background: #fff; }
  #banner .from { position: absolute; left: 90px; top: 26px; font-weight: 700; font-size: 34px; color: #6b6b72; letter-spacing: 2px; }
  #banner .now { position: absolute; right: 34px; top: 26px; font-weight: 700; font-size: 32px; color: #8b8b92; }
  #banner .msg { position: absolute; left: 30px; right: 30px; top: 78px; font-weight: 800; font-size: 46px; color: #111; line-height: 1.05; }
  #banner .msg b { color: #d4161c; }

  /* phone in hand */
  #phone { position: absolute; left: 190px; top: 400px; width: 700px; height: 1300px; transform-origin: 50% 90%; transform: translateY(1700px); }
  #phone .body { position: absolute; inset: 0; border-radius: 96px; background: #141a30; box-shadow: 0 0 0 10px #05070d, 0 40px 80px rgba(0,0,0,0.6); }
  #phone .glass { position: absolute; left: 34px; right: 34px; top: 34px; bottom: 34px; border-radius: 70px; overflow: hidden;
                  background: linear-gradient(180deg, #1b2446 0%, #0e1430 100%); }
  #phone .card { position: absolute; left: 40px; right: 40px; top: 120px; height: 380px; border-radius: 40px; background: #fbfaf7; padding: 34px 40px; box-sizing: border-box; font-family: 'Barlow Condensed'; }
  #phone .card .from { font-weight: 700; font-size: 30px; color: #74747c; letter-spacing: 2px; }
  #phone .card .rule { font-weight: 800; font-size: 96px; color: #d4161c; line-height: 1.0; margin-top: 14px; font-style: italic; }
  #phone .card .txt { font-weight: 800; font-size: 52px; color: #111; line-height: 1.02; margin-top: 10px; }
  #phone .clock { position: absolute; left: 0; right: 0; top: 590px; text-align: center; font-family: 'Barlow Condensed'; font-weight: 700; font-size: 150px; color: #f3f5ff; letter-spacing: 3px; }
  #phone .date { position: absolute; left: 0; right: 0; top: 780px; text-align: center; font-family: 'Barlow Condensed'; font-weight: 700; font-size: 44px; color: #9aa6d6; letter-spacing: 3px; }
  #phone .notch { position: absolute; left: 50%; top: 52px; width: 150px; height: 40px; margin-left: -75px; border-radius: 20px; background: #05070d; }
  #phone .hand { position: absolute; left: -260px; top: 560px; width: 1220px; height: 1000px; }
  #phone.r5 .glass { background: linear-gradient(180deg, #2a0a10 0%, #0a0306 100%); }
  #phone.r5 .card { background: #fff1f1; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="glow"></div>
  <div id="phone">
    <div class="body"><div class="glass">
      <div class="card"><div class="from">UNKNOWN · now</div><div class="rule">RULE 1</div><div class="txt">Do NOT turn on your flashlight.</div></div>
      <div class="clock">3:33</div><div class="date">FRIDAY, OCTOBER 13</div>
    </div><div class="notch"></div></div>
    <svg class="hand" viewBox="0 0 1220 1000">
      <defs><linearGradient id="sk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d89a6c"/><stop offset="1" stop-color="#b9774c"/></linearGradient></defs>
      <g stroke="#0b0b12" stroke-width="12" stroke-linejoin="round" fill="url(#sk)">
        <!-- palm + wrist (sleeve) -->
        <path d="M330 520 C 330 700, 420 860, 610 900 C 800 940, 930 860, 960 700 L 960 560 C 900 640, 760 660, 600 640 C 470 620, 380 580, 330 520 Z"/>
        <path d="M520 880 L 500 1010 L 860 1010 L 860 860 Z" fill="#2a9d8f"/>
        <path d="M500 900 L 870 880" stroke="#1e7d72" stroke-width="16" fill="none"/>
        <!-- thumb on the left edge -->
        <path d="M300 520 C 250 420, 255 300, 300 230 C 330 190, 395 200, 400 255 C 405 330, 400 430, 430 560 Z"/>
        <!-- fingers wrapping the right edge -->
        <path d="M915 230 C 990 220, 1010 275, 985 310 C 965 335, 935 340, 915 335 Z"/>
        <path d="M925 360 C 1005 352, 1025 410, 1000 445 C 980 470, 948 474, 925 468 Z"/>
        <path d="M925 495 C 1000 490, 1015 545, 993 578 C 975 602, 948 606, 925 600 Z"/>
        <path d="M920 625 C 985 622, 998 670, 978 700 C 962 722, 940 726, 920 720 Z"/>
      </g>
    </svg>
  </div>
  <div id="banner"><div class="ico"></div><div class="from">UNKNOWN NUMBER</div><div class="now">now</div><div class="msg"><b>RULE 1:</b> Do NOT turn on your flashlight.</div></div>
  <div id="cap"></div>
  <div id="white"></div>
  <div id="black"></div>
</div>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
<script type="module" src="main.js"></script>
</body>
</html>
